<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DermaScan AI | Skin Screening</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; font-family: sans-serif; }
        .app-container { max-width: 500px; margin: 40px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        #video, #photo-preview { width: 100%; border-radius: 15px; margin-bottom: 15px; display: none; }
        .result-card { display: none; padding: 20px; border-radius: 15px; text-align: center; margin-top: 20px; }
        .High { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        .Moderate { background: #fff3e0; color: #ef6c00; border: 1px solid #ffe0b2; }
        .Low { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
    </style>
</head>
<body>

<div class="app-container">
    <h3 class="text-center text-primary mb-4">DermaScan AI</h3>
    
    <video id="video" autoplay playsinline></video>
    <img id="photo-preview" alt="Preview">
    <canvas id="canvas" style="display:none;"></canvas>

    <div class="d-grid gap-2">
        <button id="start-camera" class="btn btn-outline-primary" onclick="initCamera()">Use Camera</button>
        <button id="capture-btn" class="btn btn-primary" style="display:none;" onclick="takeSnapshot()">Capture Image</button>
        
        <div class="text-center text-muted my-2">-- OR --</div>
        
        <input type="file" id="file-input" class="form-control" accept="image/*" onchange="handleUpload()">
        <button class="btn btn-success mt-3" onclick="sendToBackend()">Analyze Now</button>
    </div>

    <div id="result-display" class="result-card">
        <h4 id="risk-text"></h4>
        <p id="diag-text" class="mb-1"></p>
        <strong>Confidence: <span id="conf-text"></span>%</strong>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const preview = document.getElementById('photo-preview');
    const canvas = document.getElementById('canvas');
    let activeBlob = null;

    async function initCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = stream;
        video.style.display = 'block';
        preview.style.display = 'none';
        document.getElementById('capture-btn').style.display = 'block';
    }

    function takeSnapshot() {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        canvas.toBlob(blob => {
            activeBlob = blob;
            preview.src = URL.createObjectURL(blob);
            preview.style.display = 'block';
            video.style.display = 'none';
            document.getElementById('capture-btn').style.display = 'none';
        }, 'image/jpeg');
    }

    function handleUpload() {
        const file = document.getElementById('file-input').files[0];
        activeBlob = file;
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
        video.style.display = 'none';
    }

    async function sendToBackend() {
        if (!activeBlob) return alert("Please capture or select an image!");
        
        const formData = new FormData();
        formData.append('file', activeBlob, 'scan.jpg');

        try {
            const response = await fetch('http://127.0.0.1:8000/predict', { method: 'POST', body: formData });
            const data = await response.json();
            showUI(data);
        } catch (e) {
            alert("Connection to Backend failed! Ensure FastAPI is running.");
        }
    }

    function showUI(data) {
        const resDiv = document.getElementById('result-display');
        const risk = data.risk_level.split(' ')[0]; // Gets 'High', 'Moderate', or 'Low'
        
        resDiv.style.display = 'block';
        resDiv.className = `result-card ${risk}`;
        document.getElementById('risk-text').innerText = data.risk_level;
        document.getElementById('diag-text').innerText = `Diagnosis: ${data.diagnosis.toUpperCase()}`;
        document.getElementById('conf-text').innerText = (data.confidence * 100).toFixed(1);
    }
</script>
</body>
</html>
